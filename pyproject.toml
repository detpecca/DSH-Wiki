[project]
name = "llm-wiki"
version = "0.1.0"
description = "Agent-native retrieval via compilable, self-evolving Wiki knowledge (paper implementation)"
requires-python = ">=3.10"
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
llm-wiki = "llm_wiki.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
